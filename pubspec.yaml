name: balanceit
description: Balance It by Wajiha - 100% free fun game.
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  audioplayers: ^6.8.1
  in_app_purchase: ^3.2.0
  share_plus: ^13.3.1
  in_app_review: ^2.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/balanceit_logo.png
    - assets/wajiha_logo.png
